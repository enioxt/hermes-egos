name: Upstream Sync Monitor

on:
  schedule:
    # 06:00 BRT (09:00 UTC) — diariamente
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_check:
        description: "Forçar verificação mesmo sem novos commits"
        required: false
        default: "false"

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream main --depth=200

      - name: Check for new upstream commits
        id: diff
        run: |
          # Commits em upstream não no fork
          NEW_COMMITS=$(git log origin/main..upstream/main --oneline 2>/dev/null | wc -l | tr -d ' ')
          echo "new_commits=$NEW_COMMITS" >> $GITHUB_OUTPUT

          if [ "$NEW_COMMITS" = "0" ]; then
            echo "No new upstream commits"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "$NEW_COMMITS new commits from upstream"

          # Categorizar commits
          SECURITY=$(git log origin/main..upstream/main --oneline | grep -iE "security|vuln|cve|CVE|fix.*auth|auth.*fix" | wc -l | tr -d ' ')
          BREAKING=$(git log origin/main..upstream/main --oneline | grep -iE "BREAKING|breaking change|\!:" | wc -l | tr -d ' ')
          BUGFIX=$(git log origin/main..upstream/main --oneline | grep -iE "^[a-f0-9]+ fix" | wc -l | tr -d ' ')
          FEATURE=$(git log origin/main..upstream/main --oneline | grep -iE "^[a-f0-9]+ feat" | wc -l | tr -d ' ')

          echo "security=$SECURITY" >> $GITHUB_OUTPUT
          echo "breaking=$BREAKING" >> $GITHUB_OUTPUT
          echo "bugfix=$BUGFIX" >> $GITHUB_OUTPUT
          echo "feature=$FEATURE" >> $GITHUB_OUTPUT

      - name: Generate diff report
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          DATE=$(date +%Y-%m-%d)
          REPORT_FILE="upstream-monitor/${DATE}.md"
          mkdir -p upstream-monitor

          NEW=${{ steps.diff.outputs.new_commits }}
          SECURITY=${{ steps.diff.outputs.security }}
          BREAKING=${{ steps.diff.outputs.breaking }}
          BUGFIX=${{ steps.diff.outputs.bugfix }}
          FEATURE=${{ steps.diff.outputs.feature }}

          # Determinar prioridade geral
          if [ "$BREAKING" -gt "0" ]; then
            PRIORITY="🚨 BREAKING"
          elif [ "$SECURITY" -gt "0" ]; then
            PRIORITY="🔴 SECURITY"
          elif [ "$BUGFIX" -gt "0" ]; then
            PRIORITY="🟢 BUGFIX"
          elif [ "$FEATURE" -gt "0" ]; then
            PRIORITY="🟡 FEATURE"
          else
            PRIORITY="⚪ OUTROS"
          fi

          cat > "$REPORT_FILE" << REPORT
          # Upstream Hermes — Sync Report ${DATE}

          **Prioridade:** ${PRIORITY}
          **Commits novos:** ${NEW}

          | Categoria | Quantidade | Ação recomendada |
          |-----------|------------|-----------------|
          | 🚨 BREAKING | ${BREAKING} | Planejar rollout — avisar clientes 7d antes |
          | 🔴 SECURITY | ${SECURITY} | Merge em <48h obrigatório |
          | 🟢 BUGFIX | ${BUGFIX} | Merge no próximo sprint semanal |
          | 🟡 FEATURE | ${FEATURE} | Avaliar utilidade para clientes Central EGOS |

          ## Commits

          \`\`\`
          $(git log origin/main..upstream/main --oneline | head -50)
          \`\`\`

          ## Decisão necessária

          - [ ] Revisar commits acima
          - [ ] Decidir: MERGE | ADIAR | IGNORAR por categoria
          - [ ] Executar sync se necessário:

          \`\`\`bash
          git fetch upstream
          git rebase upstream/main
          # Resolver conflitos (ver EGOS-FORK-GUIDE.md)
          git push origin main
          \`\`\`

          ---
          *Gerado automaticamente — $(date -u '+%Y-%m-%d %H:%M UTC')*
          REPORT

          echo "Report generated: $REPORT_FILE"
          cat "$REPORT_FILE"

      - name: Commit report
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          git config user.name "EGOS Upstream Monitor"
          git config user.email "noreply@egos.ia.br"
          DATE=$(date +%Y-%m-%d)
          git add "upstream-monitor/${DATE}.md"
          git diff --cached --quiet || git commit -m "chore(upstream): sync report ${DATE} — ${{ steps.diff.outputs.new_commits }} new commits [${{ steps.diff.outputs.security }} sec/${{ steps.diff.outputs.breaking }} breaking/${{ steps.diff.outputs.bugfix }} fix/${{ steps.diff.outputs.feature }} feat]"
          git push origin main || true

      - name: Create GitHub Issue for SECURITY or BREAKING
        if: steps.diff.outputs.has_changes == 'true' && (steps.diff.outputs.security > 0 || steps.diff.outputs.breaking > 0)
        uses: actions/github-script@v7
        with:
          script: |
            const security = ${{ steps.diff.outputs.security }};
            const breaking = ${{ steps.diff.outputs.breaking }};
            const date = new Date().toISOString().split('T')[0];

            const priority = breaking > 0 ? '🚨 BREAKING' : '🔴 SECURITY';
            const label = breaking > 0 ? 'breaking-change' : 'security';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${priority}] Upstream Hermes sync needed — ${date}`,
              body: `Upstream NousResearch/hermes-agent tem commits que requerem ação imediata.\n\n- 🔴 Security: ${security}\n- 🚨 Breaking: ${breaking}\n\nVer \`upstream-monitor/${date}.md\` para detalhes.\n\n**Ação:** revisar e mergear conforme EGOS-FORK-GUIDE.md`,
              labels: [label, 'upstream-sync']
            });

      - name: Notify Telegram (SECURITY or BREAKING only)
        if: steps.diff.outputs.has_changes == 'true' && (steps.diff.outputs.security > 0 || steps.diff.outputs.breaking > 0)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SECURITY=${{ steps.diff.outputs.security }}
          BREAKING=${{ steps.diff.outputs.breaking }}
          DATE=$(date +%Y-%m-%d)

          if [ "$BREAKING" -gt "0" ]; then
            MSG="🚨 *BREAKING CHANGE* no upstream Hermes%0A%0AData: ${DATE}%0ABreaking: ${BREAKING}%0A%0ARequer planejamento de rollout antes de sync.%0AVer: github.com/enioxt/hermes-egos/issues"
          else
            MSG="🔴 *SECURITY FIX* no upstream Hermes%0A%0AData: ${DATE}%0ASecurity: ${SECURITY}%0A%0AMerge em %3C48h obrigatório.%0AVer: github.com/enioxt/hermes-egos/issues"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=Markdown" || true

      - name: Summary
        run: |
          echo "## Upstream Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "- New commits: ${{ steps.diff.outputs.new_commits }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ steps.diff.outputs.security }}" >> $GITHUB_STEP_SUMMARY
          echo "- Breaking: ${{ steps.diff.outputs.breaking }}" >> $GITHUB_STEP_SUMMARY
          echo "- Bugfix: ${{ steps.diff.outputs.bugfix }}" >> $GITHUB_STEP_SUMMARY
          echo "- Feature: ${{ steps.diff.outputs.feature }}" >> $GITHUB_STEP_SUMMARY
